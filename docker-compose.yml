# ───────────────────────────────────────────────────────────
# 北医三院崇礼 · 医生数字人（chongli-doctor）
# 对外：宿主 nginx → 127.0.0.1:13579（容器内 nginx:80）
# PG / Redis：共享 /opt/infra，不再起 sidecar Postgres
# Redis index 1 写死在 settings.py，不要改号
# ───────────────────────────────────────────────────────────
#
#   docker compose --env-file .env.production up -d --build
#
# 服务：
#   backend — Django + Gunicorn（8000）
#   worker  — 知识提取 Worker
#   nginx   — 前端静态 + 反代 API
# ───────────────────────────────────────────────────────────

name: chongli-doctor

services:

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: chongli-doctor-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-metaverse_doctor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    volumes:
      - static_vol:/app/metaverse_doctor/static
      - media_vol:/app/metaverse_doctor/media
      - logs_vol:/app/metaverse_doctor/logs
    networks:
      - default
      - infra

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: chongli-doctor-worker
    restart: unless-stopped
    entrypoint: ["/worker-entrypoint.sh"]
    env_file: .env.production
    environment:
      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-metaverse_doctor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEBUG: "False"
    volumes:
      - media_vol:/app/metaverse_doctor/media
      - logs_vol:/app/metaverse_doctor/logs
    networks:
      - default
      - infra

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: chongli-doctor-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${EXPOSE_PORT:-13579}:80"
    volumes:
      - static_vol:/srv/static:ro
      - media_vol:/srv/media:ro
    networks:
      - default

volumes:
  static_vol:
  media_vol:
  logs_vol:

networks:
  infra:
    external: true
