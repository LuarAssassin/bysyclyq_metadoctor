# ───────────────────────────────────────────────────
# 北医三院·医生元宇宙 — Nginx 反向代理 + 前端托管
# ───────────────────────────────────────────────────

upstream backend {
    server backend:8000;
}

server {
    listen       80;
    server_name  _;
    charset      utf-8;

    # 文件上传限制（与 Django DATA_UPLOAD_MAX_MEMORY_SIZE 对齐）
    client_max_body_size 200M;

    # ── gzip 压缩 ──
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_types       text/plain text/css text/xml application/json
                     application/javascript application/xml+rss
                     application/atom+xml image/svg+xml;

    # ── Django 静态文件（collectstatic 输出）──
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django 媒体文件（用户上传）──
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # ── 后端 API ──
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（关闭缓冲，加大超时）
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Django Admin ──
    location /admin/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 医生端前端（/doctor/ 子路径）──
    location /doctor/ {
        alias /usr/share/nginx/html/doctor/;
        try_files $uri $uri/ /doctor/index.html;
    }

    # ── 患者端前端（根路径 /）──
    location / {
        root /usr/share/nginx/html/patient;
        try_files $uri $uri/ /index.html;
    }
}
