<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ResearchFish 登录验证码</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f6f8; color: #24292f; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
    .wrapper { width: 100%; padding: 24px 0; background: #f5f6f8; }
    .container { width: 100%; max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 10px; overflow: hidden; }
    .header { padding: 20px 24px; background: #0b57d0; color: #fff; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { height: 28px; width: auto; max-width: 120px; display: block; }
    .brand-name { font-size: 18px; font-weight: 600; }
    .hero { padding: 24px; border-bottom: 1px solid #eee; }
    .hero h1 { margin: 0; font-size: 22px; }
    .content { padding: 20px 24px 10px; font-size: 14px; line-height: 1.75; }
    .content p { margin: 0 0 14px; }
    .code-box-wrap { padding: 0 24px 22px; }
    .code-box { background: #f0f6ff; border: 1px solid #dbe8ff; border-radius: 8px; padding: 18px 16px; text-align: center; }
    .code-label { font-size: 12px; color: #57606a; margin: 0 0 10px; }
    .code-value { margin: 0; font-size: 34px; letter-spacing: 8px; font-weight: 700; color: #0b57d0; }
    .note { padding: 0 24px 24px; font-size: 12px; color: #57606a; line-height: 1.7; }
    .footer { padding: 16px 24px 28px; background: #fafbfc; color: #57606a; font-size: 12px; line-height: 1.7; }
    @media only screen and (max-width: 480px) {
      .brand img { height: 24px; max-width: 100px; }
      .brand-name { font-size: 16px; }
      .code-value { font-size: 30px; letter-spacing: 6px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <div class="brand">
          <img src="https://citygpt.x3yun.com/media/message_images/微信图片_20250815145230_4_164.png" alt="ResearchFish Logo">
          <div class="brand-name">ResearchFish</div>
        </div>
      </div>

      <div class="hero">
        <h1>登录验证码</h1>
      </div>

      <div class="content">
        <p>您好，您正在进行账号登录验证。</p>
        <p>请在页面中输入以下验证码完成登录：</p>
      </div>

      <div class="code-box-wrap">
        <div class="code-box">
          <p class="code-label">验证码</p>
          <p class="code-value">{{code}}</p>
        </div>
      </div>

      <div class="note">
        验证码 5 分钟内有效，请勿将验证码泄露给他人。<br>
        若非本人操作，请忽略本邮件。
      </div>

      <div class="footer">
        本邮件由 DeepvalueAI ResearchFish 系统自动发送，请勿直接回复。<br>
        Copyright © 2025 DeepvalueAI ResearchFish. All rights reserved.
      </div>
    </div>
  </div>
</body>
</html>
